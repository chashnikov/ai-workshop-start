# The demo's screenshots (e2e/screenshots/), rendered again as CI renders them, and committed to the branch it is
# run on: after a change to the page, on purpose. Actions → Update screenshots → Run workflow, or
# `gh workflow run update-screenshots.yml --ref <branch>`.
name: Update screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:screenshots -- --update-snapshots
      - name: Commit the screenshots
        run: |
          git add e2e/screenshots
          if git diff --cached --quiet; then echo "The screenshots are up to date."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update the demo screenshots'
          git push
